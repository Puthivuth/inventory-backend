name: Django CI/CD with Docker

on:
  push:
    branches:
      - production
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - run: |
          pip install -r requirements.txt

      - run: python manage.py migrate

      - run: pytest


  docker-latest:
    runs-on: ubuntu-latest
    needs: test

    if: github.ref == 'refs/heads/production'

    steps:
      - uses: actions/checkout@v3

      - name: Login Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push latest
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/django-inventory:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/django-inventory:latest

      - name: Create Git Tag
        run: |
          VERSION=v$(date +%Y.%m.%d.%H%M)

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git tag $VERSION
          git push origin $VERSION


  tag-build:
    runs-on: ubuntu-latest
    needs: test

    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v3

      - name: Login Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push version image
        run: |
          VERSION=${GITHUB_REF#refs/tags/}

          docker build -t ${{ secrets.DOCKER_USERNAME }}/django-inventory:$VERSION .
          docker push ${{ secrets.DOCKER_USERNAME }}/django-inventory:$VERSION


  deploy:
    runs-on: self-hosted
    needs: tag-build

    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Deploy
        run: |
          VERSION=${GITHUB_REF#refs/tags/}

          docker pull ${{ secrets.DOCKER_USERNAME }}/django-inventory:$VERSION

          docker stop inventory || true
          docker rm inventory || true

          docker run -d \
            --name inventory \
            -p 8000:8000 \
            ${{ secrets.DOCKER_USERNAME }}/django-inventory:$VERSION