name: Django CI/CD with Docker

on:
push:
branches:
- master
- stage
- production
pull_request:
branches:
- master
- stage
- production

jobs:
test:
runs-on: ubuntu-latest

```
env:
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_PORT: ${{ secrets.DB_PORT }}
  DJANGO_SETTINGS_MODULE: core.settings

steps:
  - uses: actions/checkout@v3

  - uses: actions/setup-python@v4
    with:
      python-version: "3.11"

  - run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - run: python manage.py migrate

  - name: Run pytest
    run: pytest
```

docker:
runs-on: ubuntu-latest
needs: test

```
steps:
  - uses: actions/checkout@v3

  - name: Log in to Docker Hub
    uses: docker/login-action@v2
    with:
      username: ${{ secrets.DOCKER_USERNAME }}
      password: ${{ secrets.DOCKER_PASSWORD }}

  - name: Build and push to dev (master branch)
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    run: |
      docker build -t ${{ secrets.DOCKER_USERNAME }}/django-inventory:dev .
      docker push ${{ secrets.DOCKER_USERNAME }}/django-inventory:dev

  - name: Build and push to staging (stage branch)
    if: github.ref == 'refs/heads/stage' && github.event_name == 'push'
    run: |
      docker build -t ${{ secrets.DOCKER_USERNAME }}/django-inventory:staging .
      docker push ${{ secrets.DOCKER_USERNAME }}/django-inventory:staging

  - name: Build and push to production (production branch)
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'
    run: |
      VERSION=$(date +%Y.%m.%d)

      docker build -t ${{ secrets.DOCKER_USERNAME }}/django-inventory:latest .
      docker build -t ${{ secrets.DOCKER_USERNAME }}/django-inventory:$VERSION .

      docker push ${{ secrets.DOCKER_USERNAME }}/django-inventory:latest
      docker push ${{ secrets.DOCKER_USERNAME }}/django-inventory:$VERSION
```
