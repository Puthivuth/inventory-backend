name: Django CI/CD with Docker

on:
  push:
    branches:
      - master
      - stage
      - production
    tags:
      - 'v*'

  pull_request:
    branches:
      - master
      - stage
      - production


jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DJANGO_SETTINGS_MODULE: core.settings

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - run: python manage.py migrate

      - name: Run pytest
        run: pytest


  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---------------- DEV ----------------
      - name: Build and push dev (master)
        if: github.ref == 'refs/heads/master'
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/django-inventory:dev .
          docker push ${{ secrets.DOCKER_USERNAME }}/django-inventory:dev

      # ---------------- STAGING ----------------
      - name: Build and push staging
        if: github.ref == 'refs/heads/stage'
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/django-inventory:staging .
          docker push ${{ secrets.DOCKER_USERNAME }}/django-inventory:staging

      # ---------------- PRODUCTION ----------------
      - name: Build and push production
        if: github.ref == 'refs/heads/production'
        run: |
          VERSION=$(date +%Y.%m.%d)

          docker build -t ${{ secrets.DOCKER_USERNAME }}/django-inventory:latest .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/django-inventory:$VERSION .

          docker push ${{ secrets.DOCKER_USERNAME }}/django-inventory:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/django-inventory:$VERSION

      # ---------------- TAG VERSION (v1.0.0) ----------------
      - name: Build and push version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/}

          docker build -t ${{ secrets.DOCKER_USERNAME }}/django-inventory:$VERSION .
          docker push ${{ secrets.DOCKER_USERNAME }}/django-inventory:$VERSION
  deploy:
    runs-on: self-hosted
    needs: docker

    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Deploy on server
        run: |
          VERSION=${GITHUB_REF#refs/tags/}

          docker pull puthivuth10/django-inventory:$VERSION

          docker stop inventory || true
          docker rm inventory || true

          docker run -d \
            --name inventory \
            -p 8000:8000 \
            puthivuth10/django-inventory:$VERSION